<!-- =========================================================
     TỆP: index.html - CORE SPA ROUTER & GLOBAL STATE
     ========================================================= -->
<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" href="hub.png">
  <title>MXT HUB - Thought Leader Dashboard</title>
  
  <!-- CDN Thư viện Hệ thống -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  
  <!-- NẠP CSS DÙNG CHUNG -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= MÀN HÌNH ĐĂNG NHẬP ================= -->
  <div id="screen-login" style="display: none; background-color: var(--tblr-primary); min-height: 100vh; align-items: center; justify-content: center; padding: 20px;">
    <div class="card-luxury fade-in p-5 text-center" style="width: 100%; max-width: 420px; position: relative; margin-top: 40px; border-radius: 32px;">
      
      <div style="background-color: var(--tblr-primary); color: white; width: 80px; height: 80px; border-radius: 24px; display: flex; align-items: center; justify-content: center; font-size: 40px; margin: -80px auto 20px auto; box-shadow: 0 10px 20px rgba(20, 102, 84, 0.3);">
        <i class="ti ti-fingerprint"></i>
      </div>
      
      <h2 style="color: var(--tblr-primary); font-weight: 800; font-size: 24px; text-transform: uppercase; margin: 0;">MAI XUÂN THÀNH</h2>
      <div style="color: #64748b; font-size: 11px; font-weight: 700; letter-spacing: 1px; margin-top: 4px; margin-bottom: 30px;">PERSONAL ASSISTANT SYSTEM</div>
      
      <form id="frmLogin" onsubmit="event.preventDefault(); processLogin();">
        <div class="position-relative mb-3">
          <i class="ti ti-user position-absolute text-muted" style="left: 20px; top: 50%; transform: translateY(-50%); font-size: 20px;"></i>
          <input type="email" id="loginEmail" class="form-control border-0" placeholder="Email đăng nhập..." required style="padding: 16px 20px 16px 50px;">
        </div>
        
        <div class="position-relative mb-4">
          <i class="ti ti-lock position-absolute text-muted" style="left: 20px; top: 50%; transform: translateY(-50%); font-size: 20px;"></i>
          <input type="password" id="loginPass" class="form-control border-0" placeholder="Mật khẩu..." required style="padding: 16px 20px 16px 50px;">
        </div>

        <button type="submit" id="btnLogin" class="btn-brand w-100 fs-4 py-3 d-flex justify-content-center align-items-center" style="border-radius: 16px;">
          <span>ĐĂNG NHẬP HỆ THỐNG</span><i class="ti ti-arrow-right ms-2"></i>
        </button>
      </form>
    </div>
  </div>

  <!-- ================= MÀN HÌNH ỨNG DỤNG ================= -->
  <div id="screen-app" class="page" style="display: none;">
    <!-- SIDEBAR BÊN TRÁI -->
    <aside class="navbar navbar-vertical navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <h1 class="navbar-brand mt-lg-3">
          <span><i class="ti ti-shield-check" style="color: #2ae1b2;"></i> MXT HUB</span>
        </h1>
        <div class="collapse navbar-collapse mt-lg-4" id="sidebar-menu">
          <ul class="navbar-nav pt-lg-3 w-100">
            <!-- CÁC MODULE VỆ TINH -->
            <li class="nav-item">
              <a class="nav-link nav-menu active" id="nav-dashboard" onclick="switchPage('dashboard')" style="cursor: pointer;">
                <i class="ti ti-smart-home me-3 fs-2"></i> Trang Chủ
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-task" onclick="switchPage('task')" style="cursor: pointer;">
                <i class="ti ti-layout-kanban me-3 fs-2"></i> Quản lý Công việc
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-seo" onclick="switchPage('seo')" style="cursor: pointer;">
                <i class="ti ti-sitemap me-3 fs-2"></i> Hỗ trợ SEO
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-congviec" onclick="switchPage('congviec')" style="cursor: pointer;">
                <i class="ti ti-calendar-check me-3 fs-2"></i> Lịch Làm Việc
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-crm" onclick="switchPage('crm')" style="cursor: pointer;">
                <i class="ti ti-users me-3 fs-2"></i> CRM Khách Hàng
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-thuchi" onclick="switchPage('thuchi')" style="cursor: pointer;">
                <i class="ti ti-wallet me-3 fs-2"></i> Quản Lý Tài Chính
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-matkhau" onclick="switchPage('matkhau')" style="cursor: pointer;">
                <i class="ti ti-key me-3 fs-2"></i> Kho Mật Khẩu
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-phimanh" onclick="switchPage('phimanh')" style="cursor: pointer;">
                <i class="ti ti-movie me-3 fs-2"></i> Thư Viện Phim Ảnh
              </a>
            </li>
            <li class="nav-item mt-auto mb-3">
              <a class="nav-link text-danger" onclick="handleLogout()" style="cursor: pointer; background: rgba(239, 68, 68, 0.08);">
                <i class="ti ti-logout me-3 fs-2"></i> Đăng Xuất
              </a>
            </li>
          </ul>
        </div>
      </div>
    </aside>

    <!-- WRAPPER VÀ VÙNG CHỨA DỮ LIỆU ĐỘNG (ROUTER VIEW) -->
    <div class="page-wrapper">
      <div id="dynamic-content">
        <div class="text-center py-5 text-muted mt-5">
          <span class="spinner-border spinner-border-sm me-2"></span> Đang khởi động hệ thống...
        </div>
      </div>
    </div>
  </div>

  <!-- ================= LOGIC TOÀN CỤC CỦA CORE ROUTER ================= -->
  <script>
    // 1. KẾT NỐI API TOÀN CỤC (Biến window dùng chung cho mọi file vệ tinh)
    const SUPABASE_URL = 'https://hwdpfyooxbblwybbfxpk.supabase.co'; 
    const SUPABASE_KEY = 'sb_publishable_lDIh4gJWaWmnoAJUfUSCxQ_MMCo3LBS'; 
    window.sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.currentUser = null;

    // Bộ Alert chuẩn
    window.UI = {
      toast: Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true }),
      success: (msg) => window.UI.toast.fire({ icon: 'success', title: msg }),
      error: (msg) => Swal.fire({ icon: 'error', title: 'Lỗi hệ thống', text: msg, confirmButtonColor: '#146654' })
    };

    // 2. LOGIC AUTHENTICATION
    async function processLogin() {
      const email = document.getElementById('loginEmail').value.trim();
      const password = document.getElementById('loginPass').value.trim();
      const btn = document.getElementById('btnLogin');
      if (!email || !password) return window.UI.error('Nhập đủ Email và Mật khẩu!');
      
      btn.disabled = true; btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> ĐANG XÁC THỰC...';
      try {
        const { data, error } = await window.sbClient.auth.signInWithPassword({ email, password });
        if (error) throw error;
        
        window.currentUser = { id: data.user.id, email: data.user.email };
        document.getElementById('screen-login').style.display = 'none';
        document.getElementById('screen-app').style.display = 'block';
        window.UI.success('Đăng nhập thành công!');
        switchPage('dashboard');
      } catch (err) { 
        window.UI.error(err.message === 'Invalid login credentials' ? 'Sai thông tin đăng nhập!' : err.message); 
      } finally { 
        btn.disabled = false; btn.innerHTML = '<span>ĐĂNG NHẬP HỆ THỐNG</span><i class="ti ti-arrow-right ms-2"></i>'; 
      }
    }

    // Auto check session khi F5
    window.onload = async function() {
      const { data: { session } } = await window.sbClient.auth.getSession();
      if (session) {
        window.currentUser = { id: session.user.id, email: session.user.email };
        document.getElementById('screen-login').style.display = 'none';
        document.getElementById('screen-app').style.display = 'block';
        switchPage('dashboard');
      } else {
        document.getElementById('screen-login').style.display = 'flex';
      }
    };

    async function handleLogout() {
      await window.sbClient.auth.signOut();
      window.location.reload();
    }

    // 3. ENGINE ROUTER ĐỘNG (XỬ LÝ MODULE)
    async function switchPage(pageId) {
      // Làm sáng Menu
      document.querySelectorAll('.nav-menu').forEach(el => el.classList.remove('active'));
      const activeNavLink = document.getElementById('nav-' + pageId);
      if(activeNavLink) activeNavLink.classList.add('active');

      const contentDiv = document.getElementById('dynamic-content');
      contentDiv.innerHTML = '<div class="text-center py-5 text-muted mt-5"><span class="spinner-border spinner-border-sm me-2"></span> Đang nạp phân hệ...</div>';

      try {
        // Fetch mã nguồn của trang con từ thư mục pages/
        const response = await fetch(`pages/page_${pageId}.html`);
        if (!response.ok) throw new Error(`Tính năng [${pageId}] đang được lập trình hoặc không tìm thấy file!`);
        
        contentDiv.innerHTML = await response.text();

        // Kỹ thuật ép trình duyệt thực thi đoạn JS nằm bên trong đoạn HTML vừa tải về.
        // Nhờ kỹ thuật này, không cần code cứng bất cứ lệnh IF nào ở file index.html nữa!
        Array.from(contentDiv.querySelectorAll("script")).forEach(oldScript => {
          const newScript = document.createElement("script");
          Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
        });
      } catch (error) {
        contentDiv.innerHTML = `<div class="container-xl mt-4"><div class="alert alert-warning border-0 shadow-sm"><i class="ti ti-alert-circle me-2"></i>${error.message}</div></div>`;
      }
    }
  </script>
</body>
</html>
