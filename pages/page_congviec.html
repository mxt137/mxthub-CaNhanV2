<script>
  // ==========================================
  // KHAI BÁO BIẾN TOÀN CỤC CHỐNG LỖI SPA
  // ==========================================
  window.mxt_cv_currentStartOfWeek = window.mxt_cv_currentStartOfWeek || new Date();
  window.mxt_cv_weeklyTasks = window.mxt_cv_weeklyTasks || [];
  window.mxt_cv_tempCopyTasks = window.mxt_cv_tempCopyTasks || [];
  
  // ==========================================
  // 1. KHỞI TẠO & TÍNH TOÁN NGÀY
  // ==========================================
  window.initCongViec = async function() {
    window.changeWeek(0); 
  };

  window.changeWeek = function(offset) {
    if (offset === 0) {
      window.mxt_cv_currentStartOfWeek = new Date();
    } else {
      window.mxt_cv_currentStartOfWeek.setDate(window.mxt_cv_currentStartOfWeek.getDate() + (offset * 7));
    }
    
    const day = window.mxt_cv_currentStartOfWeek.getDay();
    const diff = window.mxt_cv_currentStartOfWeek.getDate() - day + (day == 0 ? -6 : 1);
    window.mxt_cv_currentStartOfWeek.setDate(diff);
    window.mxt_cv_currentStartOfWeek.setHours(0,0,0,0);
    
    window.loadWeeklyTasks();
  };

  window.getFormatDate = function(dateObj) {
    const yyyy = dateObj.getFullYear();
    const mm = String(dateObj.getMonth() + 1).padStart(2, '0');
    const dd = String(dateObj.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  };

  // ==========================================
  // 2. FETCH DATA VÀ THỐNG KÊ
  // ==========================================
  window.loadWeeklyTasks = async function() {
    if(!window.currentUser) return;
    
    const endOfWeek = new Date(window.mxt_cv_currentStartOfWeek);
    endOfWeek.setDate(endOfWeek.getDate() + 6);
    
    const startStr = window.getFormatDate(window.mxt_cv_currentStartOfWeek);
    const endStr = window.getFormatDate(endOfWeek);
    
    document.getElementById('cvWeekRange').innerText = `${window.mxt_cv_currentStartOfWeek.toLocaleDateString('vi-VN')} - ${endOfWeek.toLocaleDateString('vi-VN')}`;
    document.getElementById('cvWeekContainer').innerHTML = '<div class="text-center py-5 w-100 text-muted"><span class="spinner-border spinner-border-sm me-2"></span>Đang tải dữ liệu tuần...</div>';

    try {
      const { data, error } = await window.sbClient.from('tasks')
        .select('*')
        .eq('user_id', window.currentUser.id)
        .gte('task_date', startStr)
        .lte('task_date', endStr)
        .order('created_at', { ascending: true });

      if (error) throw error;
      window.mxt_cv_weeklyTasks = data || [];
      
      let tCount = window.mxt_cv_weeklyTasks.length;
      let cCount = window.mxt_cv_weeklyTasks.filter(t => t.status === 'COMPLETED').length;
      let iCount = window.mxt_cv_weeklyTasks.filter(t => t.status === 'IN_PROGRESS').length;
      let pCount = window.mxt_cv_weeklyTasks.filter(t => t.status === 'PENDING').length;
      
      document.getElementById('statTotal').innerText = tCount;
      document.getElementById('statCompleted').innerText = cCount;
      document.getElementById('statProgress').innerText = iCount;
      document.getElementById('statPending').innerText = pCount;

      window.renderWeeklyBoard();
    } catch(e) {
      document.getElementById('cvWeekContainer').innerHTML = '<div class="text-danger p-4">Lỗi tải dữ liệu. Vui lòng kiểm tra Bảng tasks.</div>';
    }
  };

  // ==========================================
  // 3. RENDER BẢNG PHÂN NHÓM
  // ==========================================
  window.updateTaskStatus = async function(id, newStatus) {
    try {
      const {error} = await window.sbClient.from('tasks').update({status: newStatus}).eq('id', id);
      if(!error) window.loadWeeklyTasks(); 
    } catch(e) { console.error("Lỗi cập nhật trạng thái", e); }
  };

  window.renderTaskCardHtml = function(t) {
    let stClass = 'st-pending'; 
    if(t.status === 'IN_PROGRESS') stClass = 'st-progress'; 
    if(t.status === 'COMPLETED') stClass = 'st-completed'; 
    
    const isDoneClass = t.status === 'COMPLETED' ? 'completed-task' : '';
    
    const tIcon = t.icon || 'ti-circle-check';
    const tColor = t.color || '#3b82f6';
    
    const selectHtml = `
      <select class="badge-select ${stClass}" onchange="window.updateTaskStatus('${t.id}', this.value)">
        <option value="PENDING" ${t.status === 'PENDING' ? 'selected' : ''}>Chưa làm</option>
        <option value="IN_PROGRESS" ${t.status === 'IN_PROGRESS' ? 'selected' : ''}>Đang làm</option>
        <option value="COMPLETED" ${t.status === 'COMPLETED' ? 'selected' : ''}>Hoàn thành</option>
      </select>
    `;

    return `
      <div class="cv-task-card ${isDoneClass}">
        <div class="d-flex justify-content-between align-items-center mb-3 pb-2 border-bottom" style="border-color: rgba(0,0,0,0.04) !important;">
          ${selectHtml}
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-icon text-muted bg-transparent border-0" onclick="window.openTaskModal('${t.id}')" onmouseover="this.classList.replace('text-muted', 'text-primary')" onmouseout="this.classList.replace('text-primary', 'text-muted')"><i class="ti ti-pencil fs-4"></i></button>
            <button class="btn btn-sm btn-icon text-muted bg-transparent border-0" onclick="window.deleteTask('${t.id}')" onmouseover="this.classList.replace('text-muted', 'text-danger')" onmouseout="this.classList.replace('text-danger', 'text-muted')"><i class="ti ti-trash fs-4"></i></button>
          </div>
        </div>
        
        <div class="task-title fw-medium text-dark mt-3 d-flex align-items-start gap-2" style="font-size: 14.5px; line-height: 1.5;">
          <i class="ti ${tIcon}" style="color: ${tColor}; font-size: 18px; flex-shrink: 0; padding-top: 2px;"></i>
          <span style="flex: 1;">${t.task_name}</span>
        </div>
      </div>
    `;
  };

  window.renderWeeklyBoard = function() {
    const container = document.getElementById('cvWeekContainer');
    const daysName = ['Thứ 2', 'Thứ 3', 'Thứ 4', 'Thứ 5', 'Thứ 6', 'Thứ 7', 'Chủ Nhật'];
    
    const dayIcons = ['ti-square-rounded-number-2', 'ti-square-rounded-number-3', 'ti-square-rounded-number-4', 'ti-square-rounded-number-5', 'ti-square-rounded-number-6', 'ti-square-rounded-number-7', 'ti-sun'];
    const darkColors = ['#1e293b', '#0f172a', '#334155', '#1e293b', '#0f172a', '#334155', '#7f1d1d'];
    
    const todayStr = window.getFormatDate(new Date());
    let html = '';

    for (let i = 0; i < 7; i++) {
      const loopDate = new Date(window.mxt_cv_currentStartOfWeek);
      loopDate.setDate(loopDate.getDate() + i);
      const dateStr = window.getFormatDate(loopDate);
      
      const isToday = (dateStr === todayStr);
      const todayIdAttr = isToday ? `id="col-today"` : '';
      
      const dateNum = String(loopDate.getDate()).padStart(2, '0');
      const monthNum = String(loopDate.getMonth()+1).padStart(2, '0');
      
      const themeColor = darkColors[i];
      
      const headerWrapperStyle = isToday 
        ? `background: linear-gradient(135deg, #146654 0%, #0a3d31 100%); color: #ffffff; padding: 14px 18px; border-radius: 20px 20px 0 0; box-shadow: 0 4px 12px rgba(20,102,84,0.3); position: relative; z-index: 2;` 
        : `background: ${themeColor}; color: #ffffff; padding: 14px 18px; border-radius: 20px 20px 0 0; border-bottom: 2px solid rgba(0,0,0,0.1);`;

      const dayTasks = window.mxt_cv_weeklyTasks.filter(t => t.task_date === dateStr);
      
      const dailyTasks = dayTasks.filter(t => t.task_type === 'DAILY');
      const onceTasks = dayTasks.filter(t => t.task_type === 'ONCE');

      let tasksHtml = '';
      if(dayTasks.length === 0) {
        tasksHtml = `<div class="text-center py-5 opacity-50" style="font-size: 14px; font-weight: 600; color: #94a3b8; border: 2px dashed #e2e8f0; border-radius: 16px; margin-top: 20px;">Lịch trống</div>`;
      } else {
        if(dailyTasks.length > 0) {
          tasksHtml += `<div class="group-label first-group group-daily"><i class="ti ti-repeat fs-4"></i> Hằng ngày</div>`;
          tasksHtml += dailyTasks.map(window.renderTaskCardHtml).join('');
        }
        if(onceTasks.length > 0) {
          tasksHtml += `<div class="group-label group-once"><i class="ti ti-bolt fs-4"></i> Phát sinh</div>`;
          tasksHtml += onceTasks.map(window.renderTaskCardHtml).join('');
        }
      }

      html += `
        <div class="cv-day-col" ${todayIdAttr}>
          <div class="cv-day-header d-flex align-items-center justify-content-between" style="${headerWrapperStyle}">
            <div class="d-flex align-items-center gap-2">
              <i class="ti ${dayIcons[i]} fs-2" style="opacity: ${isToday ? '1' : '0.7'};"></i>
              <div class="fw-bolder text-uppercase" style="font-size: 14px; letter-spacing: 0.5px;">${daysName[i]}</div>
            </div>
            <div class="fw-bold rounded-pill d-flex align-items-center justify-content-center" style="background: rgba(255,255,255,0.15); border: 1px solid rgba(255,255,255,0.1); backdrop-filter: blur(4px); padding: 4px 12px; font-size: 12px; letter-spacing: 0.5px;">
              ${dateNum}/${monthNum}
            </div>
          </div>
          
          <div class="cv-day-body">
            ${tasksHtml}
          </div>
          <div class="p-3 text-center bg-white" style="border-top: 1px solid rgba(0,0,0,0.03);">
            <button class="btn fw-bold w-100 shadow-none" style="background: rgba(20, 102, 84, 0.08); color: var(--tblr-primary); border: 1px solid rgba(20, 102, 84, 0.15); border-radius: 12px; height: 42px;" onclick="window.openTaskModal('', '${dateStr}')"><i class="ti ti-plus me-1"></i> Thêm việc</button>
          </div>
        </div>
      `;
    }
    
    container.innerHTML = html;

    // Tự động cuộn đến ngày hôm nay
    setTimeout(() => {
      const todayCol = document.getElementById('col-today');
      if (todayCol) {
        todayCol.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
      }
    }, 300);
  };

  // ==========================================
  // 4. CRUD CÔNG VIỆC
  // ==========================================
  window.openTaskModal = function(id = '', dateStr = '') {
    document.getElementById('frmTask').reset();
    document.getElementById('tId').value = id;
    
    document.querySelector('input[name="tIconColor"][value="ti-circle-check|#3b82f6"]').checked = true;
    
    if(id) {
      document.getElementById('taskModalTitle').innerHTML = '<i class="ti ti-edit me-2"></i>Sửa Công Việc';
      const task = window.mxt_cv_weeklyTasks.find(t => t.id === id);
      if(task) {
        document.getElementById('tName').value = task.task_name;
        document.getElementById('tDate').value = task.task_date;
        document.getElementById('tType').value = task.task_type;
        document.getElementById('tStatus').value = task.status;
        
        const iconColorVal = `${task.icon || 'ti-circle-check'}|${task.color || '#3b82f6'}`;
        const radio = document.querySelector(`input[name="tIconColor"][value="${iconColorVal}"]`);
        if(radio) radio.checked = true;
      }
    } else {
      document.getElementById('taskModalTitle').innerHTML = '<i class="ti ti-plus me-2"></i>Thêm Công Việc';
      document.getElementById('tDate').value = dateStr || window.getFormatDate(new Date());
    }
    
    new bootstrap.Modal(document.getElementById('modal-task')).show();
  };

  window.saveTask = async function() {
    const btn = document.getElementById('btnSaveTask');
    const id = document.getElementById('tId').value;
    const selectedIconColor = document.querySelector('input[name="tIconColor"]:checked').value.split('|');
    
    const payload = {
      task_name: document.getElementById('tName').value.trim(),
      task_date: document.getElementById('tDate').value,
      task_type: document.getElementById('tType').value,
      status: document.getElementById('tStatus').value,
      icon: selectedIconColor[0],
      color: selectedIconColor[1]
    };

    btn.disabled = true; btn.innerHTML = 'Đang lưu...';
    try {
      if(id) {
        const {error} = await window.sbClient.from('tasks').update(payload).eq('id', id);
        if(error) throw error;
      } else {
        payload.user_id = window.currentUser.id;
        const {error} = await window.sbClient.from('tasks').insert([payload]);
        if(error) throw error;
      }
      bootstrap.Modal.getInstance(document.getElementById('modal-task')).hide();
      window.loadWeeklyTasks();
    } catch(e) {
      Swal.fire('Lỗi', e.message, 'error');
    } finally {
      btn.disabled = false; btn.innerHTML = 'Lưu Công Việc';
    }
  };

  window.deleteTask = async function(id) {
    Swal.fire({
      title: 'Xóa công việc này?',
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#e11d48',
      confirmButtonText: 'Có, Xóa!'
    }).then(async (result) => {
      if (result.isConfirmed) {
        const {error} = await window.sbClient.from('tasks').delete().eq('id', id);
        if(!error) window.loadWeeklyTasks();
      }
    });
  };

  // ==========================================
  // 5. SAO CHÉP HÀNG LOẠT (BULK COPY)
  // ==========================================
  window.openCopyModal = function() {
    document.getElementById('frmCopyTask').reset();
    document.getElementById('copyTasksList').innerHTML = '<div class="text-center text-muted py-5 fw-medium" style="font-size: 14px;">Vui lòng chọn ngày Nguồn để tải danh sách.</div>';
    window.mxt_cv_tempCopyTasks = [];
    
    const today = new Date();
    const tmr = new Date(today); tmr.setDate(tmr.getDate()+1);
    
    document.getElementById('copySourceDate').value = window.getFormatDate(today);
    document.getElementById('copyTargetDateStart').value = window.getFormatDate(tmr);
    document.getElementById('copyTargetDateEnd').value = window.getFormatDate(tmr);
    
    window.loadTasksToCopy();
    new bootstrap.Modal(document.getElementById('modal-copy-task')).show();
  };

  window.loadTasksToCopy = async function() {
    const srcDate = document.getElementById('copySourceDate').value;
    const listEl = document.getElementById('copyTasksList');
    if(!srcDate) return;

    listEl.innerHTML = '<div class="text-center text-muted py-5"><span class="spinner-border spinner-border-sm"></span> Đang tải...</div>';
    
    try {
      const {data, error} = await window.sbClient.from('tasks').select('*').eq('user_id', window.currentUser.id).eq('task_date', srcDate);
      if(error) throw error;
      
      window.mxt_cv_tempCopyTasks = data || [];
      if(window.mxt_cv_tempCopyTasks.length === 0) {
        listEl.innerHTML = '<div class="text-center text-danger py-5 fw-bold" style="font-size: 14px;">Ngày này không có công việc nào để chép.</div>';
        return;
      }
      
      let html = '';
      window.mxt_cv_tempCopyTasks.forEach(t => {
        const isDaily = t.task_type === 'DAILY';
        const checked = isDaily ? 'checked' : '';
        const badge = isDaily ? `<span class="badge bg-blue-lt ms-2 border border-blue px-2">Hằng ngày</span>` : `<span class="badge bg-warning-lt ms-2 border border-warning px-2">Phát sinh</span>`;
        const tIcon = t.icon || 'ti-circle-check';
        const tColor = t.color || '#3b82f6';
        
        html += `
          <label class="list-group-item d-flex gap-3 align-items-center" style="padding: 16px 24px; cursor: pointer; border-color: rgba(0,0,0,0.04) !important; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
            <input class="form-check-input flex-shrink-0 chk-copy-task" type="checkbox" value="${t.id}" ${checked} style="width: 22px; height: 22px;">
            <div class="d-flex align-items-start gap-2">
              <i class="ti ${tIcon} mt-1" style="color: ${tColor}; font-size: 18px;"></i>
              <span class="text-dark fw-bold" style="font-size: 15px;">${t.task_name} ${badge}</span>
            </div>
          </label>
        `;
      });
      listEl.innerHTML = html;
      
    } catch(e) {
      listEl.innerHTML = `<div class="text-danger p-4 fw-bold text-center">${e.message}</div>`;
    }
  };

  window.executeCopyTasks = async function() {
    const btn = document.getElementById('btnExecuteCopy');
    const startTarget = document.getElementById('copyTargetDateStart').value;
    const endTarget = document.getElementById('copyTargetDateEnd').value;
    
    if(!startTarget || !endTarget) { Swal.fire('Lỗi', 'Vui lòng chọn đầy đủ khoảng thời gian cần chép đến.', 'warning'); return; }
    if(new Date(startTarget) > new Date(endTarget)) { Swal.fire('Lỗi', 'Ngày kết thúc phải lớn hơn hoặc bằng ngày bắt đầu.', 'warning'); return; }
    
    const checkedBoxes = document.querySelectorAll('.chk-copy-task:checked');
    if(checkedBoxes.length === 0) { Swal.fire('Lưu ý', 'Bạn chưa chọn công việc nào để chép.', 'info'); return; }
    
    const selectedIds = Array.from(checkedBoxes).map(cb => cb.value);
    const tasksToInsert = [];
    
    let loopDate = new Date(startTarget);
    const endDateObj = new Date(endTarget);
    
    while(loopDate <= endDateObj) {
      const tDateStr = window.getFormatDate(loopDate);
      window.mxt_cv_tempCopyTasks.filter(t => selectedIds.includes(t.id)).forEach(t => {
        tasksToInsert.push({
          user_id: window.currentUser.id,
          task_name: t.task_name,
          task_date: tDateStr,
          task_type: t.task_type,
          status: 'PENDING',
          icon: t.icon || 'ti-circle-check',
          color: t.color || '#3b82f6'
        });
      });
      loopDate.setDate(loopDate.getDate() + 1);
    }

    btn.disabled = true; btn.innerHTML = 'Đang đẩy lên...';
    try {
      const {error} = await window.sbClient.from('tasks').insert(tasksToInsert);
      if(error) throw error;
      
      Swal.fire({icon:'success', title:'Thành công', text:`Đã chép ${tasksToInsert.length} đầu việc!`, timer:2000, showConfirmButton:false});
      bootstrap.Modal.getInstance(document.getElementById('modal-copy-task')).hide();
      
      const tgDateObj = new Date(startTarget);
      const diffTime = tgDateObj - new Date();
      const diffWeeks = Math.floor(diffTime / (1000 * 60 * 60 * 24 * 7));
      window.changeWeek(diffWeeks); 
      
    } catch(e) {
      Swal.fire('Lỗi', e.message, 'error');
    } finally {
      btn.disabled = false; btn.innerHTML = '<i class="ti ti-rocket me-2"></i>Thực Hiện Chép';
    }
  };
</script>
