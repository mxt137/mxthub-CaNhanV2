<script>
window.mxt_kanbanGroups = [];
window.mxt_kanbanTasks = [];
window.mxt_kanbanSearchTimeout = null;
window.mxt_sortableInstances = [];

// ==========================================
// 1. KHỞI TẠO MODULE
// ==========================================
window.initTaskManager = async function() {
  await window.loadKanbanGroups();
  await window.loadKanbanTasks();
  window.initKanbanSortable();
}

window.debounceKanbanSearch = function() {
  clearTimeout(window.mxt_kanbanSearchTimeout);
  window.mxt_kanbanSearchTimeout = setTimeout(() => { window.loadKanbanTasks(); }, 500);
}

// ==========================================
// 2. KANBAN DRAG & DROP LOGIC
// ==========================================
window.initKanbanSortable = function() {
  window.mxt_sortableInstances.forEach(s => s.destroy());
  window.mxt_sortableInstances = [];

  const columns = ['list-todo', 'list-in_progress', 'list-done'];
  
  columns.forEach(colId => {
    const el = document.getElementById(colId);
    if (el) {
      const sortable = new Sortable(el, {
        group: 'kanban_board', 
        animation: 150,
        ghostClass: 'sortable-ghost',
        onEnd: async function (evt) {
          const itemEl = evt.item; 
          const taskId = itemEl.getAttribute('data-id');
          const newStatus = evt.to.getAttribute('data-status');
          const oldStatus = evt.from.getAttribute('data-status');
          
          if (newStatus !== oldStatus) {
            await window.updateKanbanTaskStatus(taskId, newStatus);
            window.updateKanbanBoardCounts();
          }
        },
      });
      window.mxt_sortableInstances.push(sortable);
    }
  });
}

window.updateKanbanBoardCounts = function() {
  const todoCount = document.getElementById('list-todo').children.length;
  const inProgCount = document.getElementById('list-in_progress').children.length;
  const doneCount = document.getElementById('list-done').children.length;
  
  // Update số lượng trên Header Cột
  document.getElementById('count-todo').innerText = todoCount;
  document.getElementById('count-in_progress').innerText = inProgCount;
  document.getElementById('count-done').innerText = doneCount;

  // Update thống kê trên Banner Tổng (Giao diện Quiet Luxury)
  document.getElementById('stat-todo').innerText = todoCount;
  document.getElementById('stat-progress').innerText = inProgCount;
  document.getElementById('stat-done').innerText = doneCount;
  document.getElementById('stat-total').innerText = todoCount + inProgCount + doneCount;
}

// ==========================================
// 3. API NHÓM CÔNG VIỆC (KANBAN GROUPS)
// ==========================================
window.loadKanbanGroups = async function() {
  try {
    const { data, error } = await window.sbClient
      .from('kanban_groups')
      .select('*')
      .eq('user_id', window.currentUser.id)
      .order('name');
    
    if (error) throw error;
    window.mxt_kanbanGroups = data || [];

    let opts = '<option value="">-- Tất cả nhóm --</option>';
    let optsForm = '<option value="">-- Chọn nhóm --</option>';
    
    window.mxt_kanbanGroups.forEach(g => {
      const html = `<option value="${g.id}">${g.name}</option>`;
      opts += html;
      optsForm += html;
    });

    document.getElementById('filterKanbanGroup').innerHTML = opts;
    document.getElementById('ktGroup').innerHTML = optsForm;
  } catch (e) { console.error('Lỗi tải nhóm Kanban:', e); }
}

window.openKanbanGroupModal = function(id = '') {
  document.getElementById('frmKanbanGroup').reset();
  document.getElementById('kgId').value = id;
  document.getElementById('btnDeleteKg').style.display = id ? 'block' : 'none';

  if (id) {
    const g = window.mxt_kanbanGroups.find(x => x.id === id);
    if (g) {
      document.getElementById('kgName').value = g.name;
      document.getElementById('kgColor').value = g.color;
      document.getElementById('kgIcon').value = g.icon;
    }
  }
  new bootstrap.Modal(document.getElementById('modal-kanban-group')).show();
}

window.saveKanbanGroup = async function() {
  const btn = document.getElementById('btnSaveKg');
  const id = document.getElementById('kgId').value;
  const payload = {
    name: document.getElementById('kgName').value.trim(),
    color: document.getElementById('kgColor').value,
    icon: document.getElementById('kgIcon').value
  };

  btn.disabled = true;
  try {
    if (id) {
      await window.sbClient.from('kanban_groups').update(payload).eq('id', id);
    } else {
      payload.user_id = window.currentUser.id;
      await window.sbClient.from('kanban_groups').insert([payload]);
    }
    
    bootstrap.Modal.getInstance(document.getElementById('modal-kanban-group')).hide();
    await window.loadKanbanGroups();
    window.loadKanbanTasks(); 
    Swal.fire({ icon: 'success', title: 'Thành công!', timer: 1500, showConfirmButton: false });
  } catch (e) {
    Swal.fire('Lỗi', e.message, 'error');
  } finally { btn.disabled = false; }
}

window.deleteKanbanGroup = async function() {
  const id = document.getElementById('kgId').value;
  const conf = await Swal.fire({ title: 'Xóa nhóm này?', text: "Mọi công việc thuộc nhóm sẽ bị xóa theo!", icon: 'warning', showCancelButton: true, confirmButtonColor: '#e11d48' });
  
  if (conf.isConfirmed) {
    await window.sbClient.from('kanban_groups').delete().eq('id', id);
    bootstrap.Modal.getInstance(document.getElementById('modal-kanban-group')).hide();
    await window.loadKanbanGroups();
    window.loadKanbanTasks();
  }
}

// ==========================================
// 4. API THẺ CÔNG VIỆC (KANBAN TASKS)
// ==========================================
window.loadKanbanTasks = async function() {
  const search = document.getElementById('filterKanbanSearch').value.trim();
  const groupId = document.getElementById('filterKanbanGroup').value;

  document.getElementById('list-todo').innerHTML = '<div class="text-center py-4"><span class="spinner-border text-primary"></span></div>';
  document.getElementById('list-in_progress').innerHTML = '';
  document.getElementById('list-done').innerHTML = '';

  let query = window.sbClient
    .from('kanban_tasks')
    .select('*, kanban_groups(name, color, icon)')
    .eq('user_id', window.currentUser.id)
    .order('created_at', { ascending: false });

  if (groupId) query = query.eq('group_id', groupId);
  if (search) query = query.ilike('title', `%${search}%`);

  try {
    const { data, error } = await query;
    if (error) throw error;
    window.mxt_kanbanTasks = data || [];
    window.renderKanbanBoard();
  } catch (e) { console.error('Lỗi tải tasks:', e); }
}

window.renderKanbanBoard = function() {
  const cols = { 'todo': '', 'in_progress': '', 'done': '' };

  window.mxt_kanbanTasks.forEach(t => {
    const g = t.kanban_groups || { name: 'Không phân nhóm', color: '#94a3b8', icon: 'ti-folder' };
    
    const dateStr = new Date(t.created_at).toLocaleDateString('vi-VN');
    let doneBadge = '';
    if (t.status === 'done' && t.completed_at) {
      doneBadge = `<div class="mt-2 text-success" style="font-size:11px; font-weight:600;"><i class="ti ti-check me-1"></i>Hoàn thành: ${new Date(t.completed_at).toLocaleDateString('vi-VN')}</div>`;
    }

    // Nâng cấp Card CSS
    const html = `
      <div class="kanban-card bg-white p-3 mb-3 shadow-sm position-relative" data-id="${t.id}" style="border-radius: 12px; border: 1px solid #f1f5f9; border-left: 4px solid ${g.color}; cursor: grab;">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <span class="badge" style="background: ${g.color}15; color: ${g.color}; border: 1px solid ${g.color}30; font-weight:600; cursor:pointer;" onclick="openKanbanGroupModal('${t.group_id}')" title="Chỉnh sửa Nhóm">
            <i class="ti ${g.icon} me-1"></i>${g.name}
          </span>
          <div class="d-flex gap-1">
            <button class="btn btn-sm btn-icon text-muted bg-transparent border-0" onclick="openKanbanTaskModal('${t.id}')" title="Chỉnh sửa thẻ"><i class="ti ti-pencil fs-4"></i></button>
            <button class="btn btn-sm btn-icon text-muted bg-transparent border-0 hover-danger" onclick="deleteKanbanTaskDirect('${t.id}')" title="Xóa thẻ"><i class="ti ti-trash fs-4"></i></button>
          </div>
        </div>
        <div class="fw-bold text-dark mb-2 lh-sm" style="font-size: 15px;">${t.title}</div>
        ${t.description ? `<div class="text-muted mb-3 text-truncate" style="font-size:12px;">${t.description}</div>` : ''}
        <div class="d-flex justify-content-between align-items-center pt-2 border-top">
          <span class="text-muted" style="font-size:11px;"><i class="ti ti-calendar me-1"></i>Tạo: ${dateStr}</span>
        </div>
        ${doneBadge}
      </div>
    `;
    if (cols[t.status] !== undefined) cols[t.status] += html;
  });

  document.getElementById('list-todo').innerHTML = cols['todo'];
  document.getElementById('list-in_progress').innerHTML = cols['in_progress'];
  document.getElementById('list-done').innerHTML = cols['done'];
  
  window.updateKanbanBoardCounts();
}

window.openKanbanTaskModal = function(id = '') {
  if (window.mxt_kanbanGroups.length === 0) return Swal.fire('Lưu ý', 'Bạn cần Thêm Nhóm công việc trước khi tạo Thẻ!', 'info');

  document.getElementById('frmKanbanTask').reset();
  document.getElementById('ktId').value = id;
  document.getElementById('ktStatus').value = 'todo';
  
  // Hiển thị nút xóa trong modal nếu là sửa
  document.getElementById('btnDeleteKt').style.display = id ? 'block' : 'none';

  if (id) {
    document.getElementById('kanbanTaskModalTitle').innerHTML = '<i class="ti ti-edit me-2"></i>Cập nhật Công việc';
    const t = window.mxt_kanbanTasks.find(x => x.id === id);
    if (t) {
      document.getElementById('ktTitle').value = t.title;
      document.getElementById('ktDesc').value = t.description || '';
      document.getElementById('ktGroup').value = t.group_id;
      document.getElementById('ktStatus').value = t.status;
    }
  } else {
    document.getElementById('kanbanTaskModalTitle').innerHTML = '<i class="ti ti-plus me-2"></i>Tạo Thẻ Việc Mới';
  }
  
  new bootstrap.Modal(document.getElementById('modal-kanban-task')).show();
}

window.saveKanbanTask = async function() {
  const btn = document.getElementById('btnSaveKt');
  const id = document.getElementById('ktId').value;
  
  const payload = {
    title: document.getElementById('ktTitle').value.trim(),
    description: document.getElementById('ktDesc').value.trim(),
    group_id: document.getElementById('ktGroup').value,
    status: document.getElementById('ktStatus').value
  };

  btn.disabled = true;
  try {
    if (id) {
      await window.sbClient.from('kanban_tasks').update(payload).eq('id', id);
    } else {
      payload.user_id = window.currentUser.id;
      await window.sbClient.from('kanban_tasks').insert([payload]);
    }
    
    bootstrap.Modal.getInstance(document.getElementById('modal-kanban-task')).hide();
    window.loadKanbanTasks();
  } catch (e) {
    Swal.fire('Lỗi', e.message, 'error');
  } finally { btn.disabled = false; }
}

window.updateKanbanTaskStatus = async function(id, newStatus) {
  const payload = { status: newStatus };
  if (newStatus === 'done') payload.completed_at = new Date().toISOString();
  else payload.completed_at = null; 

  try {
    await window.sbClient.from('kanban_tasks').update(payload).eq('id', id);
    const tIndex = window.mxt_kanbanTasks.findIndex(x => x.id === id);
    if (tIndex > -1) {
      window.mxt_kanbanTasks[tIndex].status = newStatus;
      window.mxt_kanbanTasks[tIndex].completed_at = payload.completed_at;
    }
    window.renderKanbanBoard(); 
  } catch (e) {
    console.error("Lỗi cập nhật trạng thái", e);
    window.loadKanbanTasks(); 
  }
}

// Bắt gọn lỗi xóa (gắn trực tiếp vào đối tượng window để Vercel không bao giờ bị mất dấu)
window.deleteKanbanTaskDirect = async function(providedId = null) {
  const id = providedId || document.getElementById('ktId').value;
  if (!id) return;
  
  const conf = await Swal.fire({ 
    title: 'Xóa thẻ này?', 
    text: "Thẻ công việc này sẽ bị xóa vĩnh viễn khỏi hệ thống!", 
    icon: 'warning', 
    showCancelButton: true, 
    confirmButtonColor: '#e11d48' 
  });
  
  if (conf.isConfirmed) {
    try {
      await window.sbClient.from('kanban_tasks').delete().eq('id', id);
      
      const modalEl = document.getElementById('modal-kanban-task');
      if (modalEl.classList.contains('show')) {
        bootstrap.Modal.getInstance(modalEl).hide();
      }
      
      window.loadKanbanTasks();
    } catch (e) {
      Swal.fire('Lỗi', e.message, 'error');
    }
  }
}
</script>
