<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0">
  <link rel="icon" type="image/png" href="hubmxt.png">
  <title>MXT HUB V2 - Personal Assistant System</title>
  
  <!-- CDN Thư viện UI & Core -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/css/tabler.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <link href="https://cdn.quilljs.com/1.3.7/quill.snow.css" rel="stylesheet">
  
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@tabler/core@latest/dist/js/tabler.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://cdn.quilljs.com/1.3.7/quill.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@latest/Sortable.min.js"></script>

  <!-- Nạp CSS Toàn cục -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 1. MÀN HÌNH ĐĂNG NHẬP -->
  <div id="screen-login" style="display: none;"></div>

  <!-- 2. MÀN HÌNH ỨNG DỤNG CHÍNH -->
  <div id="screen-app" class="page" style="display: none;">
    
    <!-- SIDEBAR VERTICAL -->
    <aside class="navbar navbar-vertical navbar-expand-lg navbar-dark">
      <div class="container-fluid">
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#sidebar-menu" aria-expanded="false">
          <i class="ti ti-menu-2 fs-1"></i>
        </button>
        <h1 class="navbar-brand navbar-brand-autodark mt-lg-3">
          <span style="font-size: 20px; font-weight: 800; letter-spacing: 0.5px;">
            <i class="ti ti-shield-check" style="color: #2ae1b2;"></i> MXT HUB V2
          </span>
        </h1>
        <div class="collapse navbar-collapse mt-lg-4" id="sidebar-menu">
          <ul class="navbar-nav pt-lg-3 w-100 h-100 d-flex flex-column">
            
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-dashboard" onclick="switchPage('dashboard')" style="cursor: pointer;">
                <i class="ti ti-smart-home me-2 fs-2 nav-link-icon"></i> Trang Chủ
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-task" onclick="switchPage('task')" style="cursor: pointer;">
                <i class="ti ti-layout-kanban me-2 fs-2 nav-link-icon"></i> Quản lý Công việc
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-seo" onclick="switchPage('seo')" style="cursor: pointer;">
                <i class="ti ti-sitemap me-2 fs-2 nav-link-icon"></i> Hỗ trợ SEO
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-crm" onclick="switchPage('crm')" style="cursor: pointer;">
                <i class="ti ti-users me-2 fs-2 nav-link-icon"></i> CRM Khách Hàng
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-thuchi" onclick="switchPage('thuchi')" style="cursor: pointer;">
                <i class="ti ti-wallet me-2 fs-2 nav-link-icon"></i> Quản Lý Tài Chính
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-matkhau" onclick="switchPage('matkhau')" style="cursor: pointer;">
                <i class="ti ti-key me-2 fs-2 nav-link-icon"></i> Kho Mật Khẩu
              </a>
            </li>
            <li class="nav-item">
              <a class="nav-link nav-menu" id="nav-phimanh" onclick="switchPage('phimanh')" style="cursor: pointer;">
                <i class="ti ti-movie me-2 fs-2 nav-link-icon"></i> Thư Viện Phim
              </a>
            </li>

            <!-- Khối Tùy chọn Tài khoản đẩy xuống đáy -->
            <li class="nav-item mt-auto mb-2">
              <a class="nav-link nav-menu" data-bs-toggle="modal" data-bs-target="#modal-change-password" style="cursor: pointer;">
                <i class="ti ti-key me-2 fs-2 nav-link-icon"></i> Đổi Mật Khẩu
              </a>
            </li>
            <li class="nav-item mb-3">
              <a class="nav-link text-danger" onclick="forceLogout()" style="cursor: pointer; background: rgba(239, 68, 68, 0.08);">
                <i class="ti ti-logout me-2 fs-2 text-danger"></i> Đăng Xuất
              </a>
            </li>
          </ul>
        </div>
      </div>
    </aside>

    <!-- WRAPPER NỘI DUNG ĐỘNG -->
    <div class="page-wrapper">
      <header id="global-topbar"></header>
      
      <!-- CÁC MODULE CON HỨNG HTML TỪ THƯ MỤC PAGES/ -->
      <div id="module-dashboard" class="app-module" style="display: none;"></div>
      <div id="module-task" class="app-module" style="display: none;"></div>
      <div id="module-seo" class="app-module" style="display: none;"></div>
      <div id="module-crm" class="app-module" style="display: none;"></div>
      <div id="module-thuchi" class="app-module" style="display: none;"></div>
      <div id="module-matkhau" class="app-module" style="display: none;"></div>
      <div id="module-phimanh" class="app-module" style="display: none;"></div>
    </div>
  </div>

  <!-- MODAL ĐỔI MẬT KHẨU TOÀN CỤC -->
  <div class="modal modal-blur fade" id="modal-change-password" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content shadow-lg border-0" style="border-radius: 16px;">
        <div class="modal-header text-white" style="background: var(--tblr-primary); border-radius: 16px 16px 0 0;">
          <h5 class="modal-title fw-bold"><i class="ti ti-key me-2"></i> Đổi Mật Khẩu Truy Cập</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
        </div>
        <form id="frmChangePass" onsubmit="event.preventDefault(); processChangePassword();">
          <div class="modal-body p-4">
            <div class="mb-3">
              <label class="form-label text-muted fw-bold" style="font-size: 12px;">Mật khẩu hiện tại <span class="text-danger">*</span></label>
              <input type="password" id="cpOldPass" class="form-control premium-input" required placeholder="Nhập mật khẩu cũ để xác thực...">
            </div>
            <div class="mb-3">
              <label class="form-label text-muted fw-bold" style="font-size: 12px;">Mật khẩu mới <span class="text-danger">*</span></label>
              <input type="password" id="cpNewPass" class="form-control premium-input" required placeholder="Nhập mật khẩu mới (tối thiểu 6 ký tự)...">
            </div>
          </div>
          <div class="modal-footer bg-light" style="border-radius: 0 0 16px 16px;">
            <button type="button" class="btn btn-light fw-bold" data-bs-dismiss="modal">Hủy</button>
            <button type="submit" id="btnChangePass" class="btn btn-brand fw-bold px-4"><i class="ti ti-check me-2"></i> Xác nhận đổi</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- LOGIC HỆ THỐNG GLOBAL -->
  <script>
    // 1. CẤU HÌNH SUPABASE CLIENT
    const SUPABASE_URL = 'https://hwdpfyooxbblwybbfxpk.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_lDIh4gJWaWmnoAJUfUSCxQ_MMCo3LBS';
    window.sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    window.currentUser = null;

    // Bộ công cụ UI Toàn cục
    window.UI = {
      toast: Swal.mixin({ toast: true, position: 'top-end', showConfirmButton: false, timer: 3000, timerProgressBar: true }),
      success: (msg) => window.UI.toast.fire({ icon: 'success', title: msg }),
      error: (msg) => window.UI.toast.fire({ icon: 'error', title: msg })
    };

    // 2. ÉP ĐĂNG XUẤT
    async function forceLogout(msg = '') {
      await window.sbClient.auth.signOut();
      window.currentUser = null;
      document.querySelectorAll('.app-module').forEach(el => el.style.display = 'none');
      document.getElementById('screen-app').style.display = 'none';
      document.getElementById('screen-login').style.display = 'flex';
      if (msg) Swal.fire({ icon: 'warning', title: 'Phiên bản hết hạn', text: msg, confirmButtonColor: '#146654' });
    }

    // 3. RENDER TOPBAR CÁ NHÂN HÓA
    // RENDER TOPBAR CÁ NHÂN HÓA (Đã tinh gọn cho 1 người dùng)
    function renderTopbar() {
      const user = window.currentUser;
      if (!user) return;
      
      const topbarEl = document.getElementById('global-topbar'); 
      if (topbarEl) {
        topbarEl.className = "navbar navbar-expand-md d-none d-lg-flex d-print-none bg-white border-bottom";
        topbarEl.innerHTML = `
          <div class="container-xl d-flex justify-content-end align-items-center w-100 py-2">
            <div class="d-flex align-items-center p-1 pe-3" style="background: #f8fafc; border-radius: 50px; border: 1px solid #e2e8f0;">
              <span class="avatar avatar-sm rounded-circle shadow-sm" style="background-image: url(https://api.dicebear.com/7.x/initials/svg?seed=${encodeURIComponent(user.display_name)}&backgroundType=gradientLinear&fontSize=45)"></span>
              <div class="ps-2 fw-bolder text-dark" style="font-size: 14px; letter-spacing: -0.2px;">${user.display_name}</div>
            </div>
          </div>
        `;
      }
    }

    // 4. BỘ ĐỊNH TUYẾN CHUYỂN MODULE (SPA ROUTER)
    // BỘ ĐỊNH TUYẾN CHUYỂN TRANG MƯỢT MÀ BẰNG FETCH API (ĐÃ FIX LỖI)
     async function switchPage(pageId) {
       if (!window.currentUser) return;
    
       // 1. FIX LỖI ĐÓNG MENU MOBILE BẰNG BOOTSTRAP API CHUẨN
       const sidebarMenu = document.getElementById('sidebar-menu');
       if (window.innerWidth < 992 && sidebarMenu && sidebarMenu.classList.contains('show')) {
         try {
           // Khởi tạo hoặc lấy instance Collapse của Bootstrap để đóng mượt mà và an toàn
           const bsCollapse = bootstrap.Collapse.getInstance(sidebarMenu) || new bootstrap.Collapse(sidebarMenu, { toggle: false });
           bsCollapse.hide();
         } catch (e) {
           sidebarMenu.classList.remove('show'); // Fallback dự phòng
         }
       }
    
       // 2. CẬP NHẬT TRẠNG THÁI ACTIVE TRÊN MENU
       document.querySelectorAll('.nav-menu').forEach(el => el.classList.remove('active'));
       const activeNavLink = document.getElementById('nav-' + pageId);
       if(activeNavLink) activeNavLink.classList.add('active');
    
       // 3. XỬ LÝ KHUNG HIỂN THỊ (FIX LỖI 'Cannot set properties of null')
       const contentWrapper = document.getElementById('dynamic-content') || document.querySelector('.page-wrapper');
       
       // Tìm module div theo trang, nếu chưa có thì tự động tạo mới (Bí quyết giữ Cache SPA)
       let moduleDiv = document.getElementById('module-' + pageId);
       if (!moduleDiv) {
         moduleDiv = document.createElement('div');
         moduleDiv.id = 'module-' + pageId;
         moduleDiv.className = 'app-module w-100'; // Đảm bảo bung full chiều rộng
         contentWrapper.appendChild(moduleDiv);
       }
    
       // 4. LOAD NỘI DUNG TỪ FILE HTML (Chỉ load 1 lần, các lần sau gọi lại cache)
       if (moduleDiv.innerHTML.trim() === '') {
         moduleDiv.innerHTML = '<div class="text-center py-5 text-muted mt-5"><span class="spinner-border spinner-border-sm me-2"></span> Đang nạp hệ thống...</div>';
         try {
           const response = await fetch(`pages/page_${pageId}.html`);
           if (!response.ok) throw new Error("Chức năng đang được cập nhật!");
           
           moduleDiv.innerHTML = await response.text();
    
           // Ép trình duyệt thực thi các thẻ Script được nạp động
           Array.from(moduleDiv.querySelectorAll("script")).forEach(oldScript => {
             const newScript = document.createElement("script");
             Array.from(oldScript.attributes).forEach(attr => newScript.setAttribute(attr.name, attr.value));
             newScript.appendChild(document.createTextNode(oldScript.innerHTML));
             oldScript.parentNode.replaceChild(newScript, oldScript);
           });
         } catch (error) {
           console.error("Lỗi SPA Router:", error);
           moduleDiv.innerHTML = `<div class="container-xl mt-4"><div class="alert alert-warning border-0 shadow-sm">${error.message}</div></div>`;
           return; // Dừng lại nếu lỗi
         }
       }
    
       // 5. ẨN CÁC MODULE KHÁC & HIỆN MODULE ĐƯỢC CHỌN
       document.querySelectorAll('.app-module').forEach(el => el.style.display = 'none');
       
       // Dọn dẹp dòng chữ "Đang tải hệ thống..." rác của file index gốc (nếu còn)
       const initLoading = contentWrapper.querySelector('.text-center.py-5.text-muted.mt-5:not(.app-module *)');
       if (initLoading) initLoading.remove();
    
       moduleDiv.style.display = 'block';
    
       // 6. KHỞI CHẠY LOGIC TÍNH NĂNG TƯƠNG ỨNG SAU KHI DOM ĐÃ SẴN SÀNG
       if (pageId === 'dashboard' && typeof initDashboard === 'function') initDashboard();
       if (pageId === 'task' && typeof initTaskManager === 'function') initTaskManager();
       if (pageId === 'seo' && typeof initSEO === 'function') initSEO();
       if (pageId === 'crm' && typeof initCRM === 'function') initCRM();
       if (pageId === 'thuchi' && typeof loadFinancialDashboard === 'function') {
          loadFinancialDashboard();
          if (typeof initTransactionsTab === 'function') initTransactionsTab();
       }
       if (pageId === 'matkhau' && typeof loadPasswords === 'function') loadPasswords();
       if (pageId === 'phimanh' && typeof loadMovies === 'function') loadMovies();
     }

    // 5. XỬ LÝ ĐỔI MẬT KHẨU
    window.processChangePassword = async function() {
      const oldPass = document.getElementById('cpOldPass').value.trim();
      const newPass = document.getElementById('cpNewPass').value.trim();
      const btn = document.getElementById('btnChangePass');

      if (!oldPass || !newPass) return Swal.fire('Lưu ý', 'Vui lòng nhập đầy đủ thông tin!', 'warning');
      if (oldPass === newPass) return Swal.fire('Lưu ý', 'Mật khẩu mới phải khác mật khẩu hiện tại!', 'warning');
      if (newPass.length < 6) return Swal.fire('Lưu ý', 'Mật khẩu mới phải từ 6 ký tự trở lên!', 'warning');

      btn.disabled = true; 
      btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang xử lý...';

      try {
        const { error: signInError } = await window.sbClient.auth.signInWithPassword({
          email: window.currentUser.email,
          password: oldPass
        });
        
        if (signInError) throw new Error('Mật khẩu hiện tại không chính xác!');

        const { error: updateError } = await window.sbClient.auth.updateUser({ password: newPass });
        if (updateError) throw updateError;

        const modalEl = document.getElementById('modal-change-password');
        if (modalEl) bootstrap.Modal.getInstance(modalEl).hide();
        document.getElementById('frmChangePass').reset();
        
        Swal.fire({
          icon: 'success',
          title: 'Đổi mật khẩu thành công',
          text: 'Vui lòng sử dụng mật khẩu mới cho lần đăng nhập sau.',
          confirmButtonColor: '#146654'
        });

      } catch (err) {
        Swal.fire('Lỗi', err.message, 'error');
      } finally {
        btn.disabled = false; 
        btn.innerHTML = '<i class="ti ti-check me-2"></i> Xác nhận đổi';
      }
    };

    // 6. KHỞI CHẠY HỆ THỐNG
    window.onload = async function() {
      const loginRes = await fetch('pages/page_login.html');
      const loginContainer = document.getElementById('screen-login');
      loginContainer.innerHTML = await loginRes.text();
      Array.from(loginContainer.querySelectorAll("script")).forEach(oldScript => {
          const newScript = document.createElement("script");
          newScript.appendChild(document.createTextNode(oldScript.innerHTML));
          oldScript.parentNode.replaceChild(newScript, oldScript);
      });

      const { data: { session } } = await window.sbClient.auth.getSession();
      
      if (session) {
        try {
          const { data: profile } = await window.sbClient.from('profiles').select('display_name').eq('id', session.user.id).single();
          window.currentUser = { 
            id: session.user.id, 
            email: session.user.email, 
            display_name: profile ? profile.display_name : 'Quản trị viên' 
          };
          
          document.getElementById('screen-login').style.display = 'none';
          document.getElementById('screen-app').style.display = 'block';
          //renderTopbar();
          switchPage('dashboard');
        } catch (e) { forceLogout(); }
      } else {
        document.getElementById('screen-login').style.display = 'flex';
        document.getElementById('screen-app').style.display = 'none';
      }
    };
  </script>
</body>
</html>
