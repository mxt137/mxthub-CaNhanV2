<div class="page-header d-print-none mt-4 fade-in">
  <div class="container-xl">
    <div class="row g-2 align-items-center">
      <div class="col">
        <h2 class="page-title text-primary fw-bolder text-uppercase">
          <i class="ti ti-key me-2"></i> Két Sắt Mật Khẩu
        </h2>
        <div class="text-muted mt-1" style="font-size: 13px;">Được mã hóa 2 lớp bằng thuật toán AES-256</div>
      </div>
      <div class="col-auto ms-auto d-print-none">
        <button class="btn btn-brand" onclick="window.openPassModal()" style="border-radius: 10px; font-weight: 600; padding: 10px 20px; box-shadow: 0 4px 12px rgba(20, 102, 84, 0.2);">
          <i class="ti ti-plus me-2"></i> Thêm Tài Khoản
        </button>
      </div>
    </div>
  </div>
</div>

<div class="page-body fade-in">
  <div class="container-xl">
    
    <div class="card mb-4 shadow-sm" style="border-radius: 16px; border: none; background: white;">
      <div class="card-body p-3">
        <div class="row g-3 align-items-center">
          <div class="col-md-3">
            <select id="filterOwner" class="form-select premium-input p-2" onchange="window.renderPassGroups()">
              <option value="">-- Tất cả chủ sở hữu --</option>
            </select>
          </div>
          <div class="col-md-9">
            <div class="input-icon input-icon-premium">
              <span class="input-icon-addon"><i class="ti ti-search"></i></span>
              <input type="text" id="filterSearch" class="form-control premium-input" placeholder="Tìm theo Tên đăng nhập, Ghi chú, Ứng dụng..." oninput="window.renderPassGroups()">
            </div>
          </div>
        </div>
      </div>
    </div>

    <div id="passwordsContainer">
      <div class="text-center py-5 text-muted"><span class="spinner-border spinner-border-sm"></span> Đang giải mã két sắt...</div>
    </div>

  </div>
</div>

<!-- MODAL THÊM / SỬA MẬT KHẨU -->
<div class="modal modal-blur fade" id="modal-password" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content shadow-lg" style="border-radius: 20px; border: none; overflow: hidden;">
      
      <div class="modal-header text-white" style="background: var(--tblr-primary); padding: 20px 24px; border-bottom: none;">
        <h5 class="modal-title fw-bold d-flex align-items-center" id="passModalTitle" style="font-size: 18px;">
          <div style="background: rgba(255,255,255,0.2); border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin-right: 12px;">
            <i class="ti ti-shield-lock fs-2"></i>
          </div>
          Lưu Tài Khoản Mới
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>

      <form id="frmPass" onsubmit="event.preventDefault(); window.savePassword();">
        <div class="modal-body p-4 pt-3">
          <input type="hidden" id="pId">
          
          <div class="row mb-3 g-3">
            <div class="col-6 mobile-stack">
              <label class="form-label text-muted fw-bold mb-1" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Chủ sở hữu <span class="text-danger">*</span></label>
              <div class="input-icon input-icon-premium">
                <span class="input-icon-addon"><i class="ti ti-user-circle"></i></span>
                <input type="text" id="pOwner" class="form-control premium-input" list="ownerList" placeholder="VD: Bố, Mẹ..." required>
                <datalist id="ownerList"></datalist>
              </div>
            </div>
            <div class="col-6 mobile-stack">
              <label class="form-label text-muted fw-bold mb-1" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Nhóm ứng dụng <span class="text-danger">*</span></label>
              <div class="input-icon input-icon-premium">
                <span class="input-icon-addon"><i class="ti ti-category"></i></span>
                <input type="text" id="pGroup" class="form-control premium-input" list="groupList" placeholder="VD: Mạng xã hội, Bank..." required>
                <datalist id="groupList"></datalist>
              </div>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted fw-bold mb-1" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Tên đăng nhập / Email <span class="text-danger">*</span></label>
            <div class="input-icon input-icon-premium">
              <span class="input-icon-addon"><i class="ti ti-at"></i></span>
              <input type="text" id="pUsername" class="form-control premium-input fw-bold text-primary" placeholder="Nhập Username..." required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label text-muted fw-bold mb-1" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Mật khẩu <span class="text-danger">*</span></label>
            <div class="input-group input-icon-premium" style="position: relative;">
              <span class="input-icon-addon" style="position: absolute; left: 0; z-index: 10;"><i class="ti ti-key"></i></span>
              <input type="password" id="pPassword" class="form-control premium-input fw-bold" placeholder="Nhập Password..." required style="letter-spacing: 3px; padding-right: 50px !important;">
              <button type="button" class="btn btn-icon border-0 position-absolute" onclick="window.togglePassVisibility('pPassword', this)" style="right: 5px; top: 5px; z-index: 10; background: transparent; color: #64748b;">
                <i class="ti ti-eye fs-3"></i>
              </button>
            </div>
            <div class="d-flex align-items-center mt-2 text-success" style="font-size: 11px; font-weight: 600;">
              <i class="ti ti-lock-check me-1 fs-4"></i> Data được mã hóa AES trước khi lên Database
            </div>
          </div>

          <div class="mb-1">
            <label class="form-label text-muted fw-bold mb-1" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Ghi chú thêm</label>
            <textarea id="pNote" class="form-control premium-input" rows="2" placeholder="Ghi chú thêm về tài khoản này..."></textarea>
          </div>

        </div>
        
        <div class="modal-footer d-flex justify-content-between align-items-center" style="background: #f8fafc; border-top: 1px solid #f1f5f9; padding: 16px 24px;">
          <a href="#" class="text-muted fw-medium text-decoration-none" data-bs-dismiss="modal">Hủy bỏ</a>
          <button type="submit" id="btnSavePass" class="btn btn-brand btn-lg btn-mobile-full shadow-sm" style="border-radius: 12px; font-weight: 600;">
            <i class="ti ti-device-floppy me-2"></i> Lưu Vào Két Sắt
          </button>
        </div>
      </form>
    </div>
  </div>
</div>

<!-- MODAL VIEW CHI TIẾT (READ-ONLY) -->
<div class="modal modal-blur fade" id="modal-pwd-view" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content shadow-lg" style="border-radius: 20px; border: none; overflow: hidden;">
      
      <div class="modal-header text-white" style="background: var(--tblr-primary); padding: 20px 24px; border-bottom: none;">
        <h5 class="modal-title fw-bold d-flex align-items-center" style="font-size: 18px;">
          <div style="background: rgba(255,255,255,0.2); border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin-right: 12px;">
            <i class="ti ti-shield-check fs-2"></i>
          </div>
          Chi Tiết Tài Khoản
        </h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      
      <div class="modal-body p-4 bg-white pt-3">
        <div class="text-center mb-4 pb-3 border-bottom">
          <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3" style="width: 60px; height: 60px; background: rgba(20, 102, 84, 0.1); color: var(--tblr-primary);">
            <i class="ti ti-key fs-1"></i>
          </div>
          <h3 class="fw-bolder text-dark m-0 fs-3" id="vPwdName">Tên tài khoản</h3>
          <a href="#" id="vPwdUrl" target="_blank" class="text-muted d-block mt-1 fw-medium" style="font-size: 13px; text-decoration: none; transition: color 0.2s;" onmouseover="this.style.color='var(--tblr-primary)'" onmouseout="this.style.color='#64748b'"><i class="ti ti-link me-1"></i><span id="vPwdUrlText">Link truy cập</span></a>
        </div>

        <div class="mb-3">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Tên đăng nhập / Email</label>
          <div class="input-group input-group-flat shadow-sm" style="border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; background: #f8fafc;">
            <input type="text" id="vPwdUsername" class="form-control bg-transparent border-0 fw-bold text-dark ps-3" style="font-size: 15px;" readonly>
            <span class="input-group-text bg-transparent border-0 pe-2">
              <button class="btn btn-sm btn-icon btn-ghost-copy border-0" onclick="window.copyToClipboard(document.getElementById('vPwdUsername').value)" title="Copy"><i class="ti ti-copy fs-3"></i></button>
            </span>
          </div>
        </div>

        <div class="mb-2">
          <label class="form-label text-muted fw-bold mb-1" style="font-size: 11px; text-transform: uppercase; letter-spacing: 0.5px;">Mật khẩu</label>
          <div class="input-group input-group-flat shadow-sm" style="border-radius: 12px; overflow: hidden; border: 1px solid #e2e8f0; background: #f8fafc;">
            <input type="password" id="vPwdPassword" class="form-control bg-transparent border-0 fw-bold text-dark ps-3" style="font-size: 15px; letter-spacing: 3px;" readonly>
            <span class="input-group-text bg-transparent border-0 gap-1 pe-2">
              <button class="btn btn-sm btn-icon btn-ghost-copy border-0" onclick="window.toggleViewPassword()" title="Hiện/Ẩn"><i class="ti ti-eye fs-3" id="vEyeIcon"></i></button>
              <button class="btn btn-sm btn-icon btn-ghost-copy border-0" onclick="window.copyToClipboard(document.getElementById('vPwdPassword').value)" title="Copy"><i class="ti ti-copy fs-3"></i></button>
            </span>
          </div>
        </div>
      </div>
      
      <div class="modal-footer d-flex justify-content-center align-items-center" style="background: #f8fafc; border-top: 1px solid #f1f5f9; padding: 16px 24px; border-radius: 0 0 20px 20px;">
        <button type="button" class="btn btn-light fw-bold px-5 shadow-sm" style="border-radius: 10px;" data-bs-dismiss="modal">Đóng Két</button>
      </div>
    </div>
  </div>
</div>

<script>
  // ==========================================
  // KHAI BÁO BIẾN TOÀN CỤC CHỐNG LỖI SPA
  // ==========================================
  window.mxt_allPasswords = window.mxt_allPasswords || [];
  
  // Khởi tạo đối tượng mã hóa AES-256 an toàn
  window.mxt_CryptoBox = window.mxt_CryptoBox || {
    get secretKey() {
      return window.currentUser ? window.currentUser.id : 'mxt-default-key-2026';
    },
    encrypt: function(text) {
      if (!text) return '';
      return CryptoJS.AES.encrypt(text, this.secretKey).toString();
    },
    decrypt: function(ciphertext) {
      if (!ciphertext) return '';
      try {
        const bytes = CryptoJS.AES.decrypt(ciphertext, this.secretKey);
        const decoded = bytes.toString(CryptoJS.enc.Utf8);
        return decoded || 'Lỗi giải mã';
      } catch (e) {
        return 'Lỗi giải mã';
      }
    }
  };

  // ==========================================
  // 1. CÁC HÀM TIỆN ÍCH UX
  // ==========================================
  window.togglePassVisibility = function(inputId, btnEl) {
    const input = document.getElementById(inputId);
    const icon = btnEl.querySelector('i');
    if (input.type === "password") {
      input.type = "text";
      icon.className = "ti ti-eye-off fs-3";
      input.style.letterSpacing = "normal";
    } else {
      input.type = "password";
      icon.className = "ti ti-eye fs-3";
      input.style.letterSpacing = "3px";
    }
  };

  window.copyToClipboard = function(text) {
    navigator.clipboard.writeText(text).then(() => {
      window.UI.toast.fire({ icon: 'success', title: 'Đã copy mật khẩu!' });
    });
  };

  // ==========================================
  // 2. TẢI VÀ HIỂN THỊ DỮ LIỆU TỪ SUPABASE
  // ==========================================
  window.loadPasswords = async function() {
    const container = document.getElementById('passwordsContainer');
    if (!container) return;

    try {
      const { data, error } = await window.sbClient.from('passwords').select('*').order('app_group').order('owner_name');
      if (error) throw error;
      
      window.mxt_allPasswords = data || [];
      
      const uniqueOwners = [...new Set(window.mxt_allPasswords.map(p => p.owner_name))];
      const uniqueGroups = [...new Set(window.mxt_allPasswords.map(p => p.app_group))];
      
      const ownerListEl = document.getElementById('ownerList');
      if (ownerListEl) ownerListEl.innerHTML = uniqueOwners.map(o => `<option value="${o}">`).join('');
      
      const groupListEl = document.getElementById('groupList');
      if (groupListEl) groupListEl.innerHTML = uniqueGroups.map(g => `<option value="${g}">`).join('');
      
      const filterOwnerEl = document.getElementById('filterOwner');
      if (filterOwnerEl) filterOwnerEl.innerHTML = '<option value="">-- Tất cả chủ sở hữu --</option>' + uniqueOwners.map(o => `<option value="${o}">${o}</option>`).join('');

      window.renderPassGroups();
    } catch (e) {
      console.error("LỖI TRÍCH XUẤT:", e);
      container.innerHTML = `<div class="text-danger text-center py-5">Lỗi trích xuất: ${e.message}</div>`;
    }
  };

  window.renderPassGroups = function() {
    const container = document.getElementById('passwordsContainer');
    if (!container) return;

    const filterOwnerEl = document.getElementById('filterOwner');
    const filterOwner = filterOwnerEl ? filterOwnerEl.value.toLowerCase() : '';
    
    const filterSearchEl = document.getElementById('filterSearch');
    const filterSearch = filterSearchEl ? filterSearchEl.value.toLowerCase().trim() : '';

    let filtered = window.mxt_allPasswords.filter(p => {
      const ownerName = p.owner_name ? p.owner_name.toLowerCase() : '';
      const appGroup = p.app_group ? p.app_group.toLowerCase() : '';
      const username = p.username ? p.username.toLowerCase() : '';
      const notes = p.notes ? p.notes.toLowerCase() : '';

      const matchOwner = filterOwner === '' || ownerName === filterOwner;
      const matchSearch = filterSearch === '' || 
                          appGroup.includes(filterSearch) || 
                          username.includes(filterSearch) || 
                          notes.includes(filterSearch);
                          
      return matchOwner && matchSearch;
    });

    if (filtered.length === 0) {
      container.innerHTML = '<div class="text-center py-5 text-muted"><i class="ti ti-ghost fs-1 mb-2"></i><br>Không tìm thấy tài khoản nào!</div>';
      return;
    }

    const grouped = filtered.reduce((acc, curr) => {
      if (!acc[curr.app_group]) acc[curr.app_group] = [];
      acc[curr.app_group].push(curr);
      return acc;
    }, {});

    let html = '';
    for (const [groupName, items] of Object.entries(grouped)) {
      html += `
        <div class="card mb-4 shadow-sm" style="border-radius: 16px; border: none; overflow: hidden;">
          <div class="pass-group-header d-flex justify-content-between align-items-center">
            <h4 class="m-0 fw-bold" style="color: var(--tblr-primary); font-size: 16px;"><i class="ti ti-folders me-2"></i> ${groupName}</h4>
            <span class="badge" style="background: rgba(20,102,84,0.1); color: var(--tblr-primary); border-radius: 6px;">${items.length} tài khoản</span>
          </div>
          
          <div class="table-responsive" style="overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 10px;">
            <table class="table table-vcenter card-table table-hover m-0" style="min-width: 800px;">
              <thead style="background: var(--tblr-primary);">
                <tr>
                  <th style="font-size: 12px; font-weight: bold; color: #ffffff !important; text-transform: uppercase;">Tài khoản & Sở hữu</th>
                  <th style="font-size: 12px; font-weight: bold; color: #ffffff !important; text-transform: uppercase;">Mật khẩu</th>
                  <th style="font-size: 12px; font-weight: bold; color: #ffffff !important; text-transform: uppercase;">Ghi chú</th>
                  <th style="font-size: 12px; font-weight: bold; color: #ffffff !important; text-transform: uppercase; text-align: center;">Cập nhật</th>
                  <th style="font-size: 12px; font-weight: bold; color: #ffffff !important; text-transform: uppercase; text-align: right;">Thao tác</th>
                </tr>
              </thead>
              <tbody>
      `;
      
      items.forEach(item => {
        const realPassword = window.mxt_CryptoBox.decrypt(item.encrypted_password);
        const dateStr = new Date(item.updated_at).toLocaleDateString('vi-VN');

        html += `
          <tr onclick="window.openPwdViewModal('${item.id}')" style="cursor: pointer; transition: background 0.2s;" onmouseover="this.style.background='#f8fafc'" onmouseout="this.style.background='transparent'">
            <td>
              <div class="fw-bold" style="color: #1e293b; font-size: 14px;">${item.username}</div>
              <div class="text-muted" style="font-size: 11px; margin-top: 2px;"><i class="ti ti-user me-1"></i>${item.owner_name}</div>
            </td>
            <td>
               <div class="d-flex align-items-center gap-2">
                <input type="password" class="form-control form-control-sm border-0 bg-transparent p-0 fw-bold" value="${realPassword}" readonly style="width: 100px; outline: none; letter-spacing: 3px; color: var(--tblr-primary);">
                <button class="btn btn-sm btn-icon btn-ghost-copy border-0" onclick="event.stopPropagation(); window.copyToClipboard('${realPassword}')" title="Copy"><i class="ti ti-copy"></i></button>
              </div>
            </td>
            <td class="text-muted" style="font-size: 13px;">${item.notes || ''}</td>
            <td class="text-center text-muted" style="font-size: 12px;">${dateStr}</td>
            <td class="text-end">
              <button class="btn btn-sm btn-icon border-0" style="background: rgba(32, 107, 196, 0.1); color: #206bc4;" onclick="event.stopPropagation(); window.openPassModal('${item.id}')" title="Sửa"><i class="ti ti-pencil"></i></button>
              <button class="btn btn-sm btn-icon border-0 ms-1" style="background: rgba(225, 29, 72, 0.1); color: #e11d48;" onclick="event.stopPropagation(); window.deletePass('${item.id}')" title="Xóa"><i class="ti ti-trash"></i></button>
            </td>
          </tr>
        `;
      });
      html += `</tbody></table></div></div>`;
    }
    container.innerHTML = html;
  };

  // ==========================================
  // 3. XỬ LÝ LƯU, XÓA & CÁC MODAL
  // ==========================================
  window.openPassModal = function(id = '') {
    document.getElementById('frmPass').reset();
    document.getElementById('pId').value = id;
    
    const passInput = document.getElementById('pPassword');
    passInput.type = "password";
    passInput.style.letterSpacing = "3px";
    passInput.nextElementSibling.querySelector('i').className = "ti ti-eye fs-3";
    
    if (id) {
      document.getElementById('passModalTitle').innerHTML = '<div style="background: rgba(255,255,255,0.2); border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin-right: 12px;"><i class="ti ti-edit fs-2"></i></div> Cập Nhật Két Sắt';
      const p = window.mxt_allPasswords.find(x => x.id === id);
      if (p) {
        document.getElementById('pOwner').value = p.owner_name;
        document.getElementById('pGroup').value = p.app_group;
        document.getElementById('pUsername').value = p.username;
        document.getElementById('pPassword').value = window.mxt_CryptoBox.decrypt(p.encrypted_password);
        document.getElementById('pNote').value = p.notes || '';
      }
    } else {
      document.getElementById('passModalTitle').innerHTML = '<div style="background: rgba(255,255,255,0.2); border-radius: 10px; width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; margin-right: 12px;"><i class="ti ti-shield-lock fs-2"></i></div> Lưu Tài Khoản Mới';
    }
    
    const el = document.getElementById('modal-password');
    (bootstrap.Modal.getInstance(el) || new bootstrap.Modal(el)).show();
  };

  window.savePassword = async function() {
    const btn = document.getElementById('btnSavePass');
    const originalText = btn.innerHTML;
    const id = document.getElementById('pId').value;
    const rawPassword = document.getElementById('pPassword').value;

    const payload = {
      app_group: document.getElementById('pGroup').value.trim(),
      owner_name: document.getElementById('pOwner').value.trim(),
      username: document.getElementById('pUsername').value.trim(),
      encrypted_password: window.mxt_CryptoBox.encrypt(rawPassword),
      notes: document.getElementById('pNote').value.trim(),
      updated_at: new Date().toISOString()
    };

    btn.disabled = true;
    btn.innerHTML = '<span class="spinner-border spinner-border-sm me-2"></span> Đang khóa két...';

    try {
      if (id) {
        const { error } = await window.sbClient.from('passwords').update(payload).eq('id', id);
        if (error) throw error;
        window.UI.success('Đã cập nhật an toàn!');
      } else {
        payload.user_id = window.currentUser.id;
        const { error } = await window.sbClient.from('passwords').insert([payload]);
        if (error) throw error;
        window.UI.success('Đã nạp vào Két sắt!');
      }

      const el = document.getElementById('modal-password');
      bootstrap.Modal.getInstance(el).hide();
      window.loadPasswords(); 
    } catch (e) {
      window.UI.error('Lỗi lưu trữ: ' + e.message);
    } finally {
      btn.disabled = false;
      btn.innerHTML = originalText;
    }
  };

  window.deletePass = async function(id) {
    Swal.fire({
      title: 'Hủy tài khoản này?',
      text: "Mật khẩu sẽ bị xóa vĩnh viễn khỏi Két Sắt!",
      icon: 'warning',
      showCancelButton: true,
      confirmButtonColor: '#e11d48',
      confirmButtonText: 'Đồng ý xóa!'
    }).then(async (result) => {
      if (result.isConfirmed) {
        try {
          const { error } = await window.sbClient.from('passwords').delete().eq('id', id);
          if (error) throw error;
          window.UI.success('Đã xóa thành công!');
          window.loadPasswords();
        } catch (e) {
          window.UI.error('Lỗi: ' + e.message);
        }
      }
    });
  };

  window.openPwdViewModal = function(id) {
    const pwd = window.mxt_allPasswords.find(p => p.id === id); 
    if(!pwd) return;

    document.getElementById('vPwdName').innerText = pwd.app_group + ' (' + pwd.owner_name + ')';
    document.getElementById('vPwdUrl').style.display = 'none';
    document.getElementById('vPwdUsername').value = pwd.username || '';
    
    const realPassword = window.mxt_CryptoBox.decrypt(pwd.encrypted_password);
    const pwdInput = document.getElementById('vPwdPassword');
    pwdInput.value = realPassword;
    pwdInput.type = 'password'; 
    document.getElementById('vEyeIcon').className = 'ti ti-eye fs-3';

    // ĐÃ FIX BỌC GIÁP: Set thuộc tính onlick trỏ vào window.copyToClipboard an toàn trên SPA
    document.querySelector('#modal-pwd-view button[title="Copy"]').setAttribute('onclick', `window.copyToClipboard('${pwd.username}')`);
    document.querySelectorAll('#modal-pwd-view button[title="Copy"]')[1].setAttribute('onclick', `window.copyToClipboard('${realPassword}')`);

    const el = document.getElementById('modal-pwd-view');
    (bootstrap.Modal.getInstance(el) || new bootstrap.Modal(el)).show();
  };

  window.toggleViewPassword = function() {
    const input = document.getElementById('vPwdPassword');
    const icon = document.getElementById('vEyeIcon');
    if (input.type === 'password') {
      input.type = 'text';
      icon.className = 'ti ti-eye-off fs-3';
    } else {
      input.type = 'password';
      icon.className = 'ti ti-eye fs-3';
    }
  };
</script>
